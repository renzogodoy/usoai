name: usoai Windows installer
on:
  push:
    branches: [main, usoai/main]
    paths: ['windows/**', '.github/workflows/windows-package.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Check UI syntax
        run: node scripts/check-ui-scripts.mjs
      - name: Test account and configuration logic
        run: cargo test --locked
      - name: Build hook
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p codenotch-hook --target-dir target/hook
      - name: Build installer
        working-directory: windows/codenotch
        run: npx --yes @tauri-apps/cli@2.11.4 build --config tauri.bundle.conf.json -- --locked
      - name: Collect installer
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)" }
          Copy-Item $setup[0].FullName usoai-Setup.exe
      - name: Test installation
        run: |
          $setup = Start-Process -FilePath .\usoai-Setup.exe -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code: $($setup.ExitCode)" }
          $hook = Get-ChildItem $env:LOCALAPPDATA -Filter codenotch-hook.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match 'usoai' } | Select-Object -First 1
          if (-not $hook) { throw 'The installed hook was not found' }
          $dir = $hook.DirectoryName
          foreach ($name in 'codenotch.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "Missing $name" }
          }
          $doctor = Start-Process -FilePath (Join-Path $dir 'codenotch.exe') -ArgumentList 'doctor' -WindowStyle Hidden -Wait -PassThru
          if ($doctor.ExitCode -ne 0) { throw "Doctor exit code: $($doctor.ExitCode)" }
          $log = Get-Content (Join-Path $env:APPDATA 'usoai\doctor.log') -Raw -ErrorAction Stop
          if ($log -notmatch 'Codenotch doctor') { throw 'Doctor did not produce its report' }
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait
      - uses: actions/upload-artifact@v7
        with:
          name: usoai-Windows-installer
          path: windows/usoai-Setup.exe
          if-no-files-found: error
